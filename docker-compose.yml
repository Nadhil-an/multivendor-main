services:
  web:
    build: .
    container_name: foodonline-web

    volumes:
      - ./foodonline_main:/app

    expose:
      - "8000"

    env_file:
      - .env.dev

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: foodonline-db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      POSTGRES_DB: food_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: foodonline-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - web

volumes:
  postgres_data: